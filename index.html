<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>实习机会 · 名企实习直推</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; background: #f6f7f9; color: #1a1a1a; }
  header { background: linear-gradient(135deg, #0f2a43, #14532d); color: #fff; padding: 48px 20px 36px; text-align: center; }
  header h1 { font-size: 2.2rem; letter-spacing: .1em; }
  header p { margin-top: 10px; opacity: .85; font-size: 1rem; }
  header .stats { margin-top: 16px; font-size: .9rem; opacity: .75; }
  .toolbar { max-width: 1200px; margin: -22px auto 0; padding: 0 16px; position: relative; z-index: 2; }
  .toolbar .bar { background: #fff; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.10); padding: 16px; }
  #search { width: 100%; padding: 12px 14px; font-size: 1rem; border: 1px solid #ddd; border-radius: 8px; outline: none; }
  #search:focus { border-color: #14532d; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .filters button { padding: 8px 16px; border: 1px solid #ddd; background: #fff; border-radius: 999px; cursor: pointer; font-size: .95rem; }
  .filters button.active { background: #14532d; color: #fff; border-color: #14532d; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 8px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
  .qr-fixed { position: fixed; top: 16px; right: 16px; z-index: 40; background: #fff; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.20); padding: 10px 10px 8px; text-align: center; }
  .qr-fixed img { width: 96px; height: 96px; display: block; }
  .qr-fixed .lbl { font-size: .8rem; color: #14532d; font-weight: 600; margin-top: 4px; }
  @media (max-width: 768px) { .qr-fixed img { width: 60px; height: 60px; } .qr-fixed { top: 10px; right: 10px; padding: 6px 6px 5px; } }
  .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.08); cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(0,0,0,.14); }
  .card img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; display: block; background: #e8e8e8; }
  .card .meta { padding: 12px 14px; }
  .card .name { font-weight: 600; font-size: 1rem; }
  .card .cat { display: inline-block; margin-top: 6px; font-size: .8rem; color: #14532d; background: #e6f2ea; border-radius: 999px; padding: 2px 10px; }
  .empty { text-align: center; color: #888; padding: 60px 0; display: none; }
  .more { max-width: 1200px; margin: 8px auto 0; padding: 0 16px 24px; }
  .more .box { background: #fff7e6; border: 1px dashed #e0a800; border-radius: 12px; padding: 18px 20px; text-align: center; color: #7a5b00; }
  footer { text-align: center; color: #888; font-size: .85rem; padding: 8px 16px 40px; line-height: 1.8; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  #lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 8px; }
  #lightbox .cap { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: #fff; font-size: 1rem; }
</style>

<div class="qr-fixed"><img src="images/qr.png" alt="扫码咨询"><div class="lbl">扫码咨询</div></div>

let activeCat = "全部";
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const filtersEl = document.getElementById("filters");
CATS.forEach(c => {
  const b = document.createElement("button");
  b.textContent = c;
  if (c === "全部") b.classList.add("active");
  b.onclick = () => { activeCat = c; document.querySelectorAll(".filters button").forEach(x => x.classList.remove("active")); b.classList.add("active"); render(); };
  filtersEl.appendChild(b);
});
function render() {
  const q = document.getElementById("search").value.trim();
  const list = POSTERS.filter(p => (activeCat === "全部" || p.cat === activeCat) && (!q || p.name.includes(q) || p.cat.includes(q)));
  grid.innerHTML = "";
  list.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<img loading="lazy" src="${p.file}" alt="${p.name}"><div class="meta"><div class="name">${p.name}</div><span class="cat">${p.cat}</span></div>`;
    card.onclick = () => {
      document.getElementById("lbimg").src = p.file;
      document.getElementById("lbcap").textContent = p.name + " · " + p.cat;
      document.getElementById("lightbox").style.display = "flex";
    };
    grid.appendChild(card);
  });
  empty.style.display = list.length ? "none" : "block";
}
document.getElementById("search").addEventListener("input", render);
document.getElementById("lightbox").onclick = () => { document.getElementById("lightbox").style.display = "none"; };
render();
